<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lift" />

  <title>Lift</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header id="nav-bar" class="nav-bar">
      <button id="nav-back" class="nav-back" hidden aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h1 id="nav-title" class="nav-title">Workout</h1>
      <button id="nav-action" class="nav-action" hidden></button>
    </header>

    <main id="view-content" class="view-content"></main>

    <nav id="tab-bar" class="tab-bar" role="tablist">
      <button class="tab" data-tab="workout" role="tab" aria-selected="true" aria-label="Workout">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><rect x="3.6" y="11.04" width="16.8" height="1.92" rx="0.5"/><rect x="1.8" y="8.64" width="1.68" height="6.72" rx="0.5"/><rect x="0.12" y="7.44" width="1.68" height="9.12" rx="0.5"/><rect x="20.52" y="8.64" width="1.68" height="6.72" rx="0.5"/><rect x="22.2" y="7.44" width="1.68" height="9.12" rx="0.5"/></svg>
      </button>
      <button class="tab" data-tab="exercises" role="tab" aria-selected="false" aria-label="Exercises">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      </button>
      <button class="tab" data-tab="progress" role="tab" aria-selected="false" aria-label="Progress">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M3.5 18.5l6-6.5 4 4L22 6.92 20.59 5.5l-7.09 8-4-4L2 17l1.5 1.5z"/></svg>
      </button>
    </nav>
  </div>

  <template id="tmpl-empty">
    <div class="empty-state">
      <div class="empty-icon"></div>
      <h2></h2>
      <p></p>
    </div>
  </template>

  <script type="module" src="./src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
