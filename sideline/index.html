<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sideline">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Sideline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Sideline<span class="ver" id="ver"></span></h1>
    <div class="week">
      <button id="prev" aria-label="Previous week">‹</button>
      <button id="weekLabel" class="week-label" aria-label="Back to this week"></button>
      <button id="next" aria-label="Next week">›</button>
    </div>
  </div>
  <nav class="chips" id="chips">
    <button data-f="all">All</button>
    <button data-f="sec">SEC</button>
    <button data-f="cfb">College</button>
    <button data-f="nfl">NFL</button>
  </nav>
</header>
<main id="list"><div class="empty">Loading games…</div></main>
<div class="foot" id="foot"></div>

<script src="app.js"></script>
</body>
</html>
